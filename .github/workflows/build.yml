name: build

# Builds the NRTH/NVX defensive audit module (DLL) and its console front-end
# (EXE) for 32-bit and 64-bit Windows, then runs the behavioural test suite.
#
#   job build-msvc   : native MSVC build   -> artifacts + smoke test
#   job build-mingw  : native MinGW-w64 build
#   job build-zig    : cross build from Linux (no Windows needed) + test suite
#   job verify       : checks the export table really carries ordinals @1..@23

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-msvc:
    name: MSVC (x86 + x64)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build DLL + CLI
        shell: cmd
        run: build_msvc.bat

      - name: Export table sanity check
        shell: pwsh
        run: |
          $dll = "dist/NRTH_audit.dll"
          if (-not (Test-Path $dll)) { throw "missing $dll" }
          $size = (Get-Item $dll).Length
          Write-Host "NRTH_audit.dll = $size bytes"
          if ($size -lt 20000) { throw "dll looks truncated" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrth-audit-msvc-${{ matrix.arch }}
          path: |
            dist/NRTH_audit.dll
            dist/NRTH_audit.lib
            dist/nrth_audit_cli.exe
          if-no-files-found: error

  build-mingw:
    name: MinGW-w64 (x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Locate the 32-bit toolchain and put it on PATH
        shell: pwsh
        run: |
          # The Chocolatey layout differs between package revisions, so search
          # for the compiler instead of guessing one path. Prefer i686 (32-bit,
          # the architecture the original module used), fall back to x86_64.
          $roots = @("C:\ProgramData\mingw64", "C:\ProgramData\chocolatey",
                     "C:\tools", "C:\mingw64", "C:\mingw32", "C:\msys64")
          foreach ($name in @("i686-w64-mingw32-g++.exe", "x86_64-w64-mingw32-g++.exe", "g++.exe")) {
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Filter $name -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
              if ($hit) {
                Write-Host "found $name -> $($hit.FullName)"
                Add-Content $env:GITHUB_PATH $hit.DirectoryName
                Add-Content $env:GITHUB_ENV "MINGW_CXX=$($hit.FullName)"
                exit 0
              }
            }
          }
          throw "no MinGW-w64 g++ found"

      - name: Build DLL + CLI
        shell: cmd
        run: build_mingw.bat "%MINGW_CXX%"

      - name: Export table sanity check
        shell: pwsh
        run: |
          $dll = Get-ChildItem dist/NRTH_audit*.dll | Select-Object -First 1
          if (-not $dll) { throw "no DLL produced" }
          Write-Host "$($dll.Name) = $($dll.Length) bytes"
          if ($dll.Length -lt 20000) { throw "dll looks truncated" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrth-audit-mingw
          # names carry an _x64 suffix when only a 64-bit compiler was found
          path: |
            dist/NRTH_audit*.dll
            dist/NRTH_audit*.lib
            dist/nrth_audit_cli*.exe
          if-no-files-found: error

  build-zig:
    name: cross-build + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        run: pip install ziglang

      - name: Build Windows DLL + EXE (x86 + x64)
        run: ./build.sh all

      - name: Native test suite (fixtures + assertions)
        run: ./build.sh test

      - name: Show export table
        run: |
          sudo apt-get install -y binutils >/dev/null
          objdump -p dist/NRTH_audit.dll | sed -n '/Ordinal\/Name Pointer/,$p' | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrth-audit-windows-binaries
          path: |
            dist/NRTH_audit.dll
            dist/NRTH_audit_x64.dll
            dist/nrth_audit_cli.exe
            dist/nrth_audit_cli_x64.exe
          if-no-files-found: error
